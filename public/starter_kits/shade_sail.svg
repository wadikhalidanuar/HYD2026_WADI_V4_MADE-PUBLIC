<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
      <defs>
        <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4299E1"/><stop offset="100%" stop-color="#90CDF4"/></linearGradient>
        <linearGradient id="sail1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FAF089"/><stop offset="100%" stop-color="#ECC94B"/></linearGradient>
        <linearGradient id="sail2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFF5F5"/><stop offset="100%" stop-color="#E2E8F0"/></linearGradient>
      </defs>
      <rect width="400" height="300" fill="url(#sky3)"/>
      <!-- Street Buildings Left and Right -->
      <polygon points="0,0 120,40 120,300 0,300" fill="#CBD5E0"/>
      <polygon points="400,0 280,40 280,300 400,300" fill="#CBD5E0"/>
      <!-- Connecting High-tension wires -->
      <line x1="80" y1="60" x2="220" y2="100" stroke="#4A5568" stroke-width="2"/>
      <line x1="220" y1="100" x2="330" y2="70" stroke="#4A5568" stroke-width="2"/>
      <line x1="90" y1="110" x2="310" y2="120" stroke="#4A5568" stroke-width="2"/>
      <!-- Triangular Shade Sails -->
      <!-- Sail A -->
      <polygon points="90,65 240,95 150,140" fill="url(#sail2)" stroke="#CBD5E0" stroke-width="1.5"/>
      <!-- Sail B -->
      <polygon points="180,90 320,75 250,150" fill="url(#sail1)" stroke="#D69E2E" stroke-width="1.5" opacity="0.95"/>
      <!-- Sail C -->
      <polygon points="110,135 270,145 190,195" fill="url(#sail2)" stroke="#CBD5E0" stroke-width="1.5"/>
      <!-- Shadows projected on street floor -->
      <polygon points="120,230 280,225 240,290 140,290" fill="#2D3748" opacity="0.45"/>
      <!-- Pavement -->
      <polygon points="120,220 280,220 320,300 80,300" fill="#E2E8F0"/>
      <polygon points="140,235 260,235 245,285 135,285" fill="#4A5568" opacity="0.35"/>
      <!-- Pedestrians walking comfortably in shade -->
      <g transform="translate(180, 215)">
        <circle cx="10" cy="12" r="6" fill="#1A202C"/>
        <path d="M6,20 Q10,38 8,60 L14,60 Q16,38 15,20 Z" fill="#2B6CB0"/>
        <circle cx="28" cy="14" r="5" fill="#1A202C"/>
        <path d="M24,20 Q28,38 27,60 L32,60 Q34,38 33,20 Z" fill="#E53E3E"/>
      </g>
    </svg>