<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#BAE6FD"/></linearGradient>
    <linearGradient id="sailYellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FDE047"/><stop offset="100%" stop-color="#EAB308"/></linearGradient>
    <linearGradient id="sailWhite" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#E2E8F0"/></linearGradient>
    <linearGradient id="sailBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#93C5FD"/><stop offset="100%" stop-color="#3B82F6"/></linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="600" height="400" fill="url(#sSky)"/>
  <!-- Buildings on left & right -->
  <polygon points="0,50 170,100 170,400 0,400" fill="#CBD5E0"/>
  <polygon points="600,60 480,100 480,400 600,400" fill="#94A3B8"/>
  <!-- Tension Anchor Cables -->
  <line x1="80" y1="90" x2="280" y2="130" stroke="#334155" stroke-width="2.5"/>
  <line x1="280" y1="130" x2="490" y2="110" stroke="#334155" stroke-width="2.5"/>
  <line x1="100" y1="150" x2="350" y2="170" stroke="#334155" stroke-width="2"/>
  <line x1="20" y1="180" x2="300" y2="200" stroke="#334155" stroke-width="2"/>
  <!-- Triangular Shade Sails Suspended Over Pedestrian Corridor -->
  <!-- Sail 1: Yellow -->
  <polygon points="80,100 320,135 180,200" fill="url(#sailYellow)" opacity="0.95" stroke="#CA8A04" stroke-width="2"/>
  <!-- Sail 2: High Albedo White -->
  <polygon points="260,125 500,110 380,210" fill="url(#sailWhite)" opacity="0.92" stroke="#94A3B8" stroke-width="2"/>
  <!-- Sail 3: Sky Blue Tier -->
  <polygon points="120,190 380,195 240,265" fill="url(#sailBlue)" opacity="0.95" stroke="#2563EB" stroke-width="2"/>
  <!-- Ground Deep Shadow Cast by Sails -->
  <polygon points="40,240 320,240 260,400 0,400" fill="#1E293B" opacity="0.55"/>
  <!-- Sidewalk -->
  <polygon points="0,240 240,240 200,400 0,400" fill="#94A3B8"/>
  <!-- Roadway -->
  <polygon points="180,180 600,160 600,400 180,400" fill="#64748B"/>
  <!-- Pedestrians walking comfortably in shade -->
  <g transform="translate(85, 235)">
    <circle cx="20" cy="35" r="8" fill="#0F172A"/>
    <path d="M12,45 L28,45 L25,100 L15,100 Z" fill="#E11D48"/>
    <rect x="14" y="100" width="12" height="35" fill="#0F172A"/>
    <ellipse cx="20" cy="138" rx="20" ry="6" fill="#000000" opacity="0.3"/>
  </g>
  <g transform="translate(145, 220)">
    <circle cx="15" cy="30" r="7" fill="#0F172A"/>
    <path d="M8,38 L22,38 L20,90 L10,90 Z" fill="#2563EB"/>
    <rect x="10" y="90" width="10" height="30" fill="#0F172A"/>
    <ellipse cx="15" cy="122" rx="16" ry="5" fill="#000000" opacity="0.3"/>
  </g>
  <!-- Cooling Badge -->
  <g transform="translate(20, 75)">
    <rect width="130" height="24" rx="12" fill="#713F12" opacity="0.9"/>
    <text x="65" y="16" fill="#FDE047" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">⛵ -4.5°C Shade Sail Active</text>
  </g>
</svg>
