<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
      <defs>
        <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#63B3ED"/><stop offset="100%" stop-color="#EBF8FF"/></linearGradient>
      </defs>
      <rect width="400" height="300" fill="url(#sky4)"/>
      <!-- Pergola Steel Frame Structure -->
      <g stroke="#2D3748" stroke-width="4">
        <!-- Vertical Posts -->
        <line x1="60" y1="80" x2="60" y2="260"/>
        <line x1="160" y1="75" x2="160" y2="255"/>
        <line x1="260" y1="75" x2="260" y2="255"/>
        <line x1="360" y1="80" x2="360" y2="260"/>
        <!-- Horizontal Roof Beams -->
        <line x1="50" y1="80" x2="370" y2="80"/>
        <line x1="55" y1="100" x2="365" y2="100"/>
      </g>
      <!-- Knitted Patchwork Panels (Community Crochet/Lace) -->
      <g stroke="#FFF" stroke-width="1.5">
        <!-- Row 1 -->
        <rect x="65" y="80" width="45" height="40" fill="#DD6B20"/>
        <circle cx="87" cy="100" r="10" fill="none" stroke="#FFF"/>
        <rect x="115" y="80" width="45" height="40" fill="#D69E2E"/>
        <circle cx="137" cy="100" r="10" fill="none" stroke="#FFF"/>
        <rect x="165" y="80" width="45" height="40" fill="#319795"/>
        <circle cx="187" cy="100" r="10" fill="none" stroke="#FFF"/>
        <rect x="215" y="80" width="45" height="40" fill="#E53E3E"/>
        <circle cx="237" cy="100" r="10" fill="none" stroke="#FFF"/>
        <rect x="265" y="80" width="45" height="40" fill="#38A169"/>
        <circle cx="287" cy="100" r="10" fill="none" stroke="#FFF"/>
        <rect x="315" y="80" width="45" height="40" fill="#805AD5"/>
        <circle cx="337" cy="100" r="10" fill="none" stroke="#FFF"/>
      </g>
      <!-- Filtered Dappled Patchwork Shadow on Ground -->
      <g fill="#2D3748" opacity="0.35">
        <ellipse cx="110" cy="265" rx="35" ry="12"/>
        <ellipse cx="180" cy="265" rx="35" ry="12"/>
        <ellipse cx="250" cy="265" rx="35" ry="12"/>
        <ellipse cx="320" cy="265" rx="35" ry="12"/>
      </g>
      <!-- Park Bench under canopy with seated residents -->
      <rect x="120" y="220" width="100" height="15" fill="#975A16" rx="2"/>
      <line x1="130" y1="235" x2="130" y2="255" stroke="#4A5568" stroke-width="4"/>
      <line x1="210" y1="235" x2="210" y2="255" stroke="#4A5568" stroke-width="4"/>
      <!-- People relaxing -->
      <circle cx="150" cy="195" r="7" fill="#2D3748"/>
      <rect x="144" y="205" width="12" height="25" fill="#E53E3E" rx="2"/>
      <circle cx="185" cy="197" r="7" fill="#2D3748"/>
      <rect x="179" y="207" width="12" height="25" fill="#2B6CB0" rx="2"/>
    </svg>